<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahansa Jayawardhana — Contact Profile</title>
  
  <!-- Inter & Newsreader typography for a classic, bespoke feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8f7f4;
      --card-bg: #ffffff;
      --text-main: #191919;
      --text-muted: #6e6d6a;
      --border: #e6e4df;
      --border-hover: #191919;
      --accent: #191919;
      --accent-hover: #333333;
      --radius: 12px;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
    }

    /* Header Profile */
    .initials-badge {
      width: 52px;
      height: 52px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--text-main);
      margin-bottom: 24px;
    }

    .profile-header h1 {
      font-family: 'Newsreader', serif;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .role-badge {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 2px;
    }

    .company-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
    }

    .divider {
      height: 1px;
      background-color: var(--border);
      margin: 28px 0;
    }

    /* Contact rows */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-main);
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      transition: var(--transition);
    }

    .contact-item:hover {
      border-color: var(--border-hover);
      background-color: var(--bg);
    }

    .contact-info {
      display: flex;
      flex-direction: column;
    }

    .contact-type {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .contact-val {
      font-size: 14px;
      font-weight: 500;
      word-break: break-all;
    }

    .action-icon {
      color: var(--text-muted);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .contact-item:hover .action-icon {
      color: var(--text-main);
      transform: translateX(2px);
    }

    /* Primary Save Contact Button */
    .save-button {
      margin-top: 24px;
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
    }

    .save-button:hover {
      background-color: var(--accent-hover);
    }

    .save-button:active {
      transform: scale(0.99);
    }

    /* Footer info */
    .card-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="initials-badge">SJ</div>
    
    <header class="profile-header">
      <h1>Sahansa Jayawardhana</h1>
      <div class="role-badge">Project Manager</div>
      <div class="company-title">Coding Legends Pvt Ltd</div>
    </header>

    <div class="divider"></div>

    <div class="section-label">Direct Communication</div>
    
    <section class="links-list">
      <!-- Phone Call -->
      <a href="tel:+94701581056" class="contact-item">
        <div class="contact-info">
          <span class="contact-type">Mobile</span>
          <span class="contact-val">+94 70 158 1056</span>
        </div>
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </div>
      </a>

      <!-- WhatsApp Message -->
      <a href="https://wa.me/94701581056" target="_blank" rel="noopener noreferrer" class="contact-item">
        <div class="contact-info">
          <span class="contact-type">WhatsApp</span>
          <span class="contact-val">+94 70 158 1056</span>
        </div>
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
        </div>
      </a>

      <!-- Email Direct -->
      <a href="mailto:sahansa@codinglegends.io" class="contact-item">
        <div class="contact-info">
          <span class="contact-type">Email</span>
          <span class="contact-val">sahansa@codinglegends.io</span>
        </div>
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </div>
      </a>
    </section>

    <!-- Save to Contacts Button -->
    <button class="save-button" onclick="saveContact()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
      Save Contact Card
    </button>

    <footer class="card-footer">
      Coding Legends Pvt Ltd
    </footer>
  </main>

  <script>
    function saveContact() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:Jayawardhana;Sahansa;;;
FN:Sahansa Jayawardhana
ORG:Coding Legends Pvt Ltd
TITLE:Project Manager
TEL;TYPE=CELL,VOICE:+94701581056
EMAIL;TYPE=WORK,INTERNET:sahansa@codinglegends.io
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Sahansa_Jayawardhana.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
