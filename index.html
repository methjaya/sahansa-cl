<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahansa Jayawardhana | Coding Legends</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0e12;
      --card-bg: #14171f;
      --card-hover: #191e28;
      --border: #232936;
      --border-accent: #323b4e;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --accent: #22c55e;
      --accent-dim: rgba(34, 197, 94, 0.12);
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 580px;
    }

    /* Bento Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .bento-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      position: relative;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .bento-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-2px);
    }

    .col-span-2 {
      grid-column: span 2;
    }

    /* Card 1: Identity */
    .profile-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .avatar-pill {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: #1f2533;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-accent);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-dim);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: #4ade80;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .profile-meta h1 {
      font-family: var(--font-display);
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .profile-meta .role {
      font-size: 14.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .profile-meta .role span {
      color: #ffffff;
      font-weight: 600;
    }

    /* Direct Contact Buttons */
    .contact-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
    }

    .contact-card:hover {
      background: var(--card-hover);
    }

    .card-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 14.5px;
      font-weight: 600;
      color: #ffffff;
      word-break: break-all;
    }

    .card-foot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 14px;
      color: var(--text-muted);
    }

    .contact-card:hover .card-foot svg {
      color: #ffffff;
      transform: translate(2px, -2px);
    }

    .card-foot svg {
      transition: transform 0.2s ease, color 0.2s ease;
    }

    /* Metric / Stat Tiles */
    .stat-tile {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-number {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }

    .stat-caption {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Save Contact Button */
    .save-vcard-btn {
      grid-column: span 2;
      background: #ffffff;
      color: #0c0e12;
      border: none;
      border-radius: var(--radius);
      padding: 18px 24px;
      font-family: var(--font-body);
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .save-vcard-btn:hover {
      background: #e5e7eb;
      transform: translateY(-2px);
    }

    .save-vcard-btn:active {
      transform: scale(0.99);
    }

    @media (max-width: 480px) {
      .bento-grid {
        grid-template-columns: 1fr;
      }
      .col-span-2 {
        grid-column: span 1;
      }
      .save-vcard-btn {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="bento-grid">
      
      <!-- Primary Identity Card -->
      <div class="bento-card col-span-2 profile-card">
        <div class="profile-top">
          <div class="avatar-pill">SJ</div>
          <div class="status-badge">
            <div class="status-dot"></div>
            <span>Taking On Projects</span>
          </div>
        </div>
        <div class="profile-meta">
          <h1>Sahansa Jayawardhana</h1>
          <p class="role">Project Manager at <span>Coding Legends Pvt Ltd</span></p>
        </div>
      </div>

      <!-- Quick Action: Direct Phone -->
      <a href="tel:+94701581056" class="bento-card contact-card">
        <div>
          <div class="card-label">Direct Line</div>
          <div class="card-value">+94 70 158 1056</div>
        </div>
        <div class="card-foot">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </div>
      </a>

      <!-- Quick Action: WhatsApp -->
      <a href="https://wa.me/94701581056" target="_blank" rel="noopener noreferrer" class="bento-card contact-card">
        <div>
          <div class="card-label">WhatsApp</div>
          <div class="card-value">Instant Chat</div>
        </div>
        <div class="card-foot">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </div>
      </a>

      <!-- Full Width: Email -->
      <a href="mailto:sahansa@codinglegends.io" class="bento-card col-span-2 contact-card">
        <div>
          <div class="card-label">Official Inquiries</div>
          <div class="card-value">sahansa@codinglegends.io</div>
        </div>
        <div class="card-foot">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </div>
      </a>

      <!-- Context Metric: Focus -->
      <div class="bento-card stat-tile">
        <div class="stat-number">Sprint & Agile</div>
        <div class="stat-caption">Delivery, Roadmap & Team Leadership</div>
      </div>

      <!-- Context Metric: Live Timezone -->
      <div class="bento-card stat-tile">
        <div class="stat-number" id="local-time">--:--</div>
        <div class="stat-caption">Colombo (GMT+5:30)</div>
      </div>

      <!-- Primary Action: Save to Phone -->
      <button class="save-vcard-btn" onclick="downloadVCard()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        Save Contact to Phone
      </button>

    </div>
  </div>

  <script>
    // Live clock for Colombo, Sri Lanka
    function updateClock() {
      const options = {
        timeZone: 'Asia/Colombo',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      };
      const formatter = new Intl.DateTimeFormat([], options);
      document.getElementById('local-time').textContent = formatter.format(new Date());
    }
    updateClock();
    setInterval(updateClock, 30000);

    // vCard file generator for quick saving on mobile
    function downloadVCard() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:Jayawardhana;Sahansa;;;
FN:Sahansa Jayawardhana
ORG:Coding Legends Pvt Ltd
TITLE:Project Manager
TEL;TYPE=CELL,VOICE:+94701581056
EMAIL;TYPE=WORK,INTERNET:sahansa@codinglegends.io
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Sahansa_Jayawardhana.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
