<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahansa Jayawardhana — Coding Legends</title>
  
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6);
      --item-bg: rgba(255, 255, 255, 0.7);
      --item-hover: rgba(255, 255, 255, 0.95);
      --item-border: rgba(226, 232, 240, 0.8);
      --cl-navy: #0f172a;
      --cl-blue: #2563eb;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: radial-gradient(circle at 15% 15%, #e0e7ff 0%, transparent 40%),
                  radial-gradient(circle at 85% 85%, #f1f5f9 0%, transparent 45%),
                  #f8fafc;
      color: var(--cl-navy);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      width: 100%;
      max-width: 390px;
      padding: 38px 26px 30px;
      text-align: center;
      box-shadow: var(--glass-shadow);
    }

    .profile-photo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px;
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.12);
    }

    h1 {
      font-size: 23px;
      font-weight: 700;
      color: var(--cl-navy);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .role {
      font-size: 14.5px;
      font-weight: 500;
      color: var(--cl-navy);
      margin-bottom: 2px;
    }

    .company {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    /* Contact Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      background: var(--item-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--item-border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--cl-navy);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .link-row:hover {
      border-color: var(--cl-blue);
      background: var(--item-hover);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 16px -4px rgba(15, 23, 42, 0.06);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cl-navy);
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .link-row:hover .link-icon {
      background: rgba(37, 99, 235, 0.08);
      color: var(--cl-blue);
      border-color: rgba(37, 99, 235, 0.2);
    }

    .link-content {
      display: flex;
      flex-direction: column;
    }

    .link-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 2px;
    }

    .link-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--cl-navy);
    }

    .arrow {
      color: var(--text-muted);
      font-size: 15px;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .link-row:hover .arrow {
      color: var(--cl-blue);
      transform: translateX(3px);
    }

    /* Actions */
    .save-btn {
      width: 100%;
      background: var(--cl-navy);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 18px -4px rgba(15, 23, 42, 0.18);
      transition: all 0.2s ease;
    }

    .save-btn:hover {
      background: #1e293b;
      transform: translateY(-1px);
    }

    .save-btn:active {
      transform: scale(0.99);
    }

    .website-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .website-link:hover {
      color: var(--cl-blue);
    }
  </style>
</head>
<body>

  <main class="card">
    <img 
      src="https://www.codinglegends.io/_next/image?url=https%3A%2F%2Fkrfu59og7ychb0mc.public.blob.vercel-storage.com%2Fsahansa.jpg%3F2026-10-16T12%253A17%253A10.370Z&w=640&q=75" 
      alt="Sahansa Jayawardhana" 
      class="profile-photo"
      loading="eager"
    >
    <h1>Sahansa Jayawardhana</h1>
    <div class="role">Project Manager</div>
    <div class="company">Coding Legends Pvt Ltd</div>

    <div class="links">
      <a href="tel:+94701581056" class="link-row">
        <div class="link-left">
          <div class="link-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <div class="link-content">
            <span class="link-label">Phone</span>
            <span class="link-value">+94 70 158 1056</span>
          </div>
        </div>
        <span class="arrow">&#8594;</span>
      </a>

      <a href="mailto:sahansa@codinglegends.io" class="link-row">
        <div class="link-left">
          <div class="link-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </div>
          <div class="link-content">
            <span class="link-label">Email</span>
            <span class="link-value">sahansa@codinglegends.io</span>
          </div>
        </div>
        <span class="arrow">&#8594;</span>
      </a>

      <a href="https://wa.me/94701581056" target="_blank" rel="noopener noreferrer" class="link-row">
        <div class="link-left">
          <div class="link-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </div>
          <div class="link-content">
            <span class="link-label">WhatsApp</span>
            <span class="link-value">Chat Directly</span>
          </div>
        </div>
        <span class="arrow">&#8594;</span>
      </a>
    </div>

    <button class="save-btn" onclick="saveContact()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
      Save Contact to Phone
    </button>

    <a href="https://www.codinglegends.io/" target="_blank" rel="noopener noreferrer" class="website-link">
      www.codinglegends.io
    </a>
  </main>

  <script>
    function saveContact() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:Jayawardhana;Sahansa;;;
FN:Sahansa Jayawardhana
ORG:Coding Legends Pvt Ltd
TITLE:Project Manager
TEL;TYPE=CELL,VOICE:+94701581056
EMAIL;TYPE=WORK,INTERNET:sahansa@codinglegends.io
URL:https://www.codinglegends.io/
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Sahansa_Jayawardhana.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
