<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahansa Jayawardhana — Coding Legends</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #fafafa;
      --border: #e5e5e5;
      --text-main: #0a0a0a;
      --text-muted: #737373;
      --accent: #0055ff;
      --accent-hover: #0044cc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      text-align: center;
    }

    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px;
      display: block;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .company {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      transition: border-color 0.15s ease;
    }

    .link-item:hover {
      border-color: var(--text-main);
    }

    .link-label {
      color: var(--text-muted);
      font-weight: 400;
    }

    .save-btn {
      width: 100%;
      background: var(--text-main);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .save-btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="sahansa.avif" alt="Sahansa Jayawardhana" class="profile-img">

    <h1>Sahansa Jayawardhana</h1>
    <div class="title">Project Manager</div>
    <div class="company">Coding Legends Pvt Ltd</div>

    <div class="links">
      <a href="tel:+94701581056" class="link-item">
        <span class="link-label">Phone</span>
        <span>+94 70 158 1056</span>
      </a>

      <a href="mailto:sahansa@codinglegends.io" class="link-item">
        <span class="link-label">Email</span>
        <span>sahansa@codinglegends.io</span>
      </a>

      <a href="https://wa.me/94701581056" target="_blank" rel="noopener noreferrer" class="link-item">
        <span class="link-label">WhatsApp</span>
        <span>Chat Direct</span>
      </a>
    </div>

    <button class="save-btn" onclick="saveContact()">
      Save Contact to Phone
    </button>
  </div>

  <script>
    function saveContact() {
      const vcard = 
`BEGIN:VCARD
VERSION:3.0
N:Jayawardhana;Sahansa;;;
FN:Sahansa Jayawardhana
ORG:Coding Legends Pvt Ltd
TITLE:Project Manager
TEL;TYPE=CELL,VOICE:+94701581056
EMAIL;TYPE=WORK,INTERNET:sahansa@codinglegends.io
URL:https://www.codinglegends.io/
END:VCARD`;

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Sahansa_Jayawardhana.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
